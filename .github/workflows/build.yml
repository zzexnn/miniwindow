name: Build RightCornerMiniWindow test APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build HyperOS 4 debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout miniwindow patches
        uses: actions/checkout@v5

      - name: Checkout pinned HyperSideBar base
        uses: actions/checkout@v5
        with:
          repository: mikudayoooooooo/HyperSideBar
          ref: e45661e0f2f51bac84d00f954ad2da0edf1c24e3
          path: upstream

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android 17 SDK and native toolchain
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.2.12479018" "cmake;4.1.2"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          # Some AGP versions look up android-37 instead of android-37.0.
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Apply minimal corner menu patch
        run: |
          python3 RightCornerMiniWindow_SourcePatch/apply_patch.py upstream

      - name: Build debug APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug --console=plain

      - name: Verify module entry and 16KB compatibility
        run: |
          python3 RightCornerMiniWindow_SourcePatch/tests/verify_apk.py upstream/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs upstream/app/build/outputs/apk/debug/app-debug.apk
          sha256sum upstream/app/build/outputs/apk/debug/app-debug.apk > upstream/app/build/outputs/apk/debug/SHA256SUMS.txt
          python3 - <<'PYTEST'
          import glob, xml.etree.ElementTree as E
          suites=[E.parse(p).getroot() for p in glob.glob('upstream/app/build/test-results/testDebugUnitTest/TEST-*.xml')]
          print('JUnit:', {k:sum(int(s.get(k,0)) for s in suites) for k in ('tests','failures','errors','skipped')})
          PYTEST

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RightCornerMiniWindow-test-reports
          path: upstream/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RightCornerMiniWindow-HyperOS4-test-apk
          path: |
            upstream/app/build/outputs/apk/debug/*.apk
            upstream/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
