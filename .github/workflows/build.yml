name: Build RightCornerMiniWindow test APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build HyperOS 4 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout miniwindow patches
        uses: actions/checkout@v4

      - name: Checkout pinned HyperSideBar base
        uses: actions/checkout@v4
        with:
          repository: mikudayoooooooo/HyperSideBar
          ref: e45661e0f2f51bac84d00f954ad2da0edf1c24e3
          path: upstream

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android build components
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-37" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;4.1.2"

      - name: Apply minimal corner menu patch
        run: |
          python3 RightCornerMiniWindow_SourcePatch/apply_patch.py upstream

      - name: Build debug APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RightCornerMiniWindow-HyperOS4-test-apk
          path: upstream/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
