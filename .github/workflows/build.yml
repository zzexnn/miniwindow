name: Build RightCornerMiniWindow unsigned APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build upstream HyperOS 4 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout miniwindow patches
        uses: actions/checkout@v5

      - name: Checkout pinned HyperSideBar base
        uses: actions/checkout@v5
        with:
          repository: mikudayoooooooo/HyperSideBar
          ref: e45661e0f2f51bac84d00f954ad2da0edf1c24e3
          path: upstream

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android 17 SDK and native toolchain
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.2.12479018" "cmake;4.1.2"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          # Some AGP versions look up android-37 instead of android-37.0.
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Apply minimal corner menu patch
        run: |
          python3 RightCornerMiniWindow_SourcePatch/apply_patch.py upstream

      - name: Build debug APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug --console=plain

      - name: Package unsigned build for fixed-key signing
        run: |
          mkdir -p delivery
          apk=$(find upstream/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$apk"
          cp "$apk" delivery/miniwindow-unsigned.apk
          # An unexpected debug signature must never be distributed.
          if "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify delivery/miniwindow-unsigned.apk >/dev/null 2>&1; then
            echo "Unexpected signed APK: refusing ephemeral signer"
            exit 1
          fi
          cp "$ANDROID_HOME/build-tools/37.0.0/lib/apksigner.jar" delivery/
          cp upstream/miniwindow-changes.json delivery/
          sha256sum delivery/miniwindow-unsigned.apk > delivery/SHA256SUMS.txt

      - name: Upload unsigned APK and signing tool
        uses: actions/upload-artifact@v4
        with:
          name: RightCornerMiniWindow-unsigned-for-fixed-signing
          path: delivery/
          if-no-files-found: error
